version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    groups:
      maven-quality-tools:
        patterns:
          - "org.apache.maven.plugins:*"
          - "com.diffplug.spotless:*"
          - "com.puppycrawl.tools:*"
          - "net.sourceforge.pmd:*"
          - "com.github.spotbugs:*"
          - "org.jacoco:*"
      test-tools:
        patterns:
          - "org.junit:*"
          - "org.junit.jupiter:*"
          - "org.junit.platform:*"
          - "org.assertj:*"
          - "org.mockito:*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:30"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
